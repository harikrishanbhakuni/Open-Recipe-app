{% extends "base.html" %}
{% block body %}

<div class="container mt-5">
<form class=" col-6 mx-auto card p-4 shadow-lg " method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <h2 class=" text-danger"> Update Order</h2>
    <hr>
    <div class="form-group">
      <label for="exampleInputEmail1">Order name</label>
      <input type="text" class="form-control" value="{{order.order_name}}" name="order_name" required>

    </div>
    <div class="form-group">
      <label >Order details</label>
      <textarea class="form-control" name="order_description"  value  required>{{order.order_description}}</textarea>
    </div>
    <div class="form-group">
        <label for="exampleInputEmail1">Order image</label>
        <input type="file" class="form-control" name="order_image">
  
      </div>
 
    
    <button type="submit" class="btn btn-danger mt-4 p-2">Order now</button>
  </form>

  
  
</div>
{% endblock body %}
