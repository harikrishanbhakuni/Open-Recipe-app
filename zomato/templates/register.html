
{% extends "base.html" %}
{% block body %}
<div class="container mt-5">
<form class="col-6 mx-auto card p-3 shadow-lg " method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <h2 class="text-danger text-center">Register </h2>
    <hr>
    {{ message.tags }}
    {% if messages %}
    <div class="alert alert-primary" role="alert">
        {% for message in messages %}
        {{ message }}
        {% endfor %}
    </div>
      
  
{% endif %}
    <div class="form-group mb-3 ">
        <label for="exampleInputEmail1">First Name</label>
        <input type="text" class="form-control" name="first_name" aria-describedby="emailHelp" placeholder="Enter Username">
        
      </div>
      <div class="form-group mb-3 ">
        <label for="exampleInputEmail1">Last Name </label>
        <input type="text" class="form-control" name="last_name" aria-describedby="emailHelp" placeholder="Enter Username">
        
      </div>
    <div class="form-group mb-3 ">
      <label for="exampleInputEmail1">User Name</label>
      <input type="text" class="form-control" name="username" aria-describedby="emailHelp" placeholder="Enter Username">
      
    </div>
    <div class="form-group">
      <label for="exampleInputPassword1">Password</label>
      <input type="password" class="form-control" name="password" placeholder="Password">
    </div>
    <p> Alredy have account:: <a href="{% url 'login_page' %}">Login</a></p>
  
    <button type="submit" class="btn btn-success">Submit</button>
  </form>
</div>
{% endblock body %}
